<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 375" width="820" height="375" role="img" aria-label="Causal influence diagram of CWM component interfaces showing observations, relational states, action, task score, and an omitted confounding factor">
  <defs>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#b91c1c"/>
    </marker>
    <style>
      .math-bold { font-family: "Times New Roman", "STIX Two Text", Georgia, serif; font-weight: 700; font-size: 21px; fill: #0f172a; }
      .math-sub { font-family: "Times New Roman", "STIX Two Text", Georgia, serif; font-style: italic; font-weight: 400; font-size: 13.5px; fill: #0f172a; }
      .math-italic { font-family: "Times New Roman", "STIX Two Text", Georgia, serif; font-style: italic; font-size: 21px; fill: #7f1d1d; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #334155; }
      .edge-label-red { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #991b1b; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #334155; }
    </style>
  </defs>

  <!-- Clean white background -->
  <rect x="0" y="0" width="820" height="375" fill="#ffffff" rx="8"/>

  <!-- Solid edges (CWM component interfaces) -->
  <!-- x_t -> r_t (inference) -->
  <line x1="126" y1="185" x2="218" y2="185" stroke="#1e293b" stroke-width="2.1" marker-end="url(#arrow-solid)"/>
  <text x="172" y="174" text-anchor="middle" class="edge-label">inference</text>

  <!-- r_t -> r_{t+1} (transition) -->
  <line x1="286" y1="185" x2="438" y2="185" stroke="#1e293b" stroke-width="2.1" marker-end="url(#arrow-solid)"/>
  <text x="362" y="174" text-anchor="middle" class="edge-label">transition</text>

  <!-- r_{t+1} -> x_{t+1} (prediction) -->
  <line x1="506" y1="185" x2="598" y2="185" stroke="#1e293b" stroke-width="2.1" marker-end="url(#arrow-solid)"/>
  <text x="552" y="174" text-anchor="middle" class="edge-label">prediction</text>

  <!-- r_t -> a_t (policy) -->
  <line x1="252" y1="151" x2="252" y2="95" stroke="#1e293b" stroke-width="2.1" marker-end="url(#arrow-solid)"/>
  <text x="262" y="125" text-anchor="start" class="edge-label">policy</text>

  <!-- a_t -> r_{t+1} -->
  <line x1="280" y1="81" x2="444" y2="168" stroke="#1e293b" stroke-width="2.1" marker-end="url(#arrow-solid)"/>

  <!-- a_t -> u_{t+1} -->
  <line x1="280" y1="64" x2="593" y2="64" stroke="#1e293b" stroke-width="2.1" marker-end="url(#arrow-solid)"/>
  <text x="440" y="54" text-anchor="middle" class="edge-label">action cost (optional)</text>

  <!-- r_{t+1} -> u_{t+1} -->
  <line x1="498" y1="164" x2="606" y2="85" stroke="#1e293b" stroke-width="2.1" marker-end="url(#arrow-solid)"/>

  <!-- x_{t+1} -> u_{t+1} -->
  <line x1="632" y1="151" x2="632" y2="104" stroke="#1e293b" stroke-width="2.1" marker-end="url(#arrow-solid)"/>

  <!-- Dashed edges (omitted factor / confounding) -->
  <!-- x_t -> a_t (policy using visual cue absent from r_t) -->
  <line x1="117" y1="161" x2="222" y2="86" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)"/>
  <text x="150" y="108" text-anchor="middle" class="edge-label-red" transform="rotate(-35 150 108)">visual cue</text>

  <!-- eps_x -> x_t -->
  <line x1="227" y1="274" x2="120" y2="206" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)"/>

  <!-- eps_x -> r_{t+1} -->
  <line x1="277" y1="274" x2="442" y2="202" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)"/>

  <!-- eps_x -> u_{t+1} (routed around right edge) -->
  <path d="M 281 286 L 732 286 Q 744 286 744 274 L 744 76 Q 744 64 732 64 L 675 64" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)"/>
  <text x="530" y="278" text-anchor="middle" class="edge-label-red">omitted factor (e.g., surface roughness) confounding response &amp; score</text>

  <!-- NODES -->
  <!-- x_t (observation, grey circle) -->
  <circle cx="92" cy="185" r="32" fill="#e2e8f0" stroke="#1e293b" stroke-width="2.1"/>
  <text x="92" y="191" text-anchor="middle" class="math-bold">x<tspan dy="5" class="math-sub">t</tspan></text>

  <!-- r_t (relational state, blue circle) -->
  <circle cx="252" cy="185" r="32" fill="#bfdbfe" stroke="#1e293b" stroke-width="2.1"/>
  <text x="252" y="191" text-anchor="middle" class="math-bold">r<tspan dy="5" class="math-sub">t</tspan></text>

  <!-- a_t (decision, orange rounded square) -->
  <rect x="224" y="38" width="56" height="52" rx="7" ry="7" fill="#fed7aa" stroke="#1e293b" stroke-width="2.1"/>
  <text x="252" y="69" text-anchor="middle" class="math-bold">a<tspan dy="5" class="math-sub">t</tspan></text>

  <!-- r_{t+1} (next relational state, blue circle) -->
  <circle cx="472" cy="185" r="32" fill="#bfdbfe" stroke="#1e293b" stroke-width="2.1"/>
  <text x="472" y="191" text-anchor="middle" class="math-bold">r<tspan dy="5" class="math-sub">t+1</tspan></text>

  <!-- x_{t+1} (next observation, grey circle) -->
  <circle cx="632" cy="185" r="32" fill="#e2e8f0" stroke="#1e293b" stroke-width="2.1"/>
  <text x="632" y="191" text-anchor="middle" class="math-bold">x<tspan dy="5" class="math-sub">t+1</tspan></text>

  <!-- u_{t+1} (task score, green diamond) -->
  <polygon points="632,26 670,64 632,102 594,64" fill="#bbf7d0" stroke="#1e293b" stroke-width="2.1"/>
  <text x="632" y="69" text-anchor="middle" class="math-bold">u<tspan dy="5" class="math-sub">t+1</tspan></text>

  <!-- eps_x (omitted factor, dashed red circle) -->
  <circle cx="252" cy="286" r="27" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="252" y="292" text-anchor="middle" class="math-italic">&#949;<tspan dy="5" class="math-sub" style="fill:#7f1d1d;">x</tspan></text>

  <!-- Legend bar -->
  <line x1="40" y1="330" x2="780" y2="330" stroke="#e2e8f0" stroke-width="1.2"/>
  <circle cx="62" cy="352" r="8" fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5"/>
  <text x="76" y="356" class="legend-text">Observation</text>

  <circle cx="178" cy="352" r="8" fill="#bfdbfe" stroke="#1e293b" stroke-width="1.5"/>
  <text x="192" y="356" class="legend-text">Relational state</text>

  <rect x="304" y="344" width="16" height="16" rx="3" fill="#fed7aa" stroke="#1e293b" stroke-width="1.5"/>
  <text x="326" y="356" class="legend-text">Action</text>

  <polygon points="392,343 401,352 392,361 383,352" fill="#bbf7d0" stroke="#1e293b" stroke-width="1.5"/>
  <text x="408" y="356" class="legend-text">Task score</text>

  <circle cx="502" cy="352" r="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="516" y="356" class="legend-text">Omitted factor</text>

  <line x1="628" y1="352" x2="656" y2="352" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="664" y="356" class="legend-text">Confounding paths</text>
</svg>
